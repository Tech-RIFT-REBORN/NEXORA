```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080b14;
  color:white;
}
nav{
  padding:20px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #20263a;
}
.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:3px;
  color:#7180ff;
}
main{
  max-width:900px;
  margin:auto;
  padding:70px 20px;
  text-align:center;
}
h1{font-size:60px;margin:10px}
.sub{color:#9aa3bb;font-size:18px}
.card{
  margin:30px auto;
  padding:25px;
  max-width:420px;
  background:#101625;
  border:1px solid #252d43;
  border-radius:16px;
}
input{
  width:100%;
  padding:13px;
  margin:7px 0;
  background:#080c16;
  color:white;
  border:1px solid #293149;
  border-radius:9px;
}
button{
  padding:12px 18px;
  border:0;
  border-radius:9px;
  background:#7180ff;
  color:white;
  font-weight:bold;
  cursor:pointer;
  margin:5px;
}
.public{
  margin:30px auto;
  padding:30px;
  background:#101625;
  border:1px solid #252d43;
  border-radius:16px;
}
.hidden{display:none}
.msg{color:#9aa3bb;margin-top:10px}
</style>
</head>

<body>

<nav>
  <div class="logo">NEXORA</div>
  <button id="logout" class="hidden">Sign Out</button>
</nav>

<main>

<h1>NEXORA</h1>
<p class="sub">Connect. Build. Grow.</p>

<!-- PUBLIC FOR EVERYONE -->
<div class="public">
  <h2>👨‍💻 Hire an Expert</h2>
  <p class="sub">
    Find skilled experts and explore available services.
    No account required.
  </p>

  <button onclick="alert('Expert marketplace coming soon!')">
    View Experts
  </button>
</div>

<!-- ACCOUNT -->
<div class="card">

  <h2 id="title">Sign In</h2>

  <input
    id="name"
    class="hidden"
    placeholder="Display name"
  >

  <input
    id="email"
    type="email"
    placeholder="Email"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
  >

  <button id="submit" onclick="auth()">
    Sign In
  </button>

  <button id="toggle" onclick="toggleMode()">
    Create Account
  </button>

  <div id="msg" class="msg"></div>

</div>

</main>

<script>

/* =========================
   SUPABASE CONFIG
   ========================= */

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   AUTH
   ========================= */

let signup = false;

function toggleMode(){

  signup = !signup;

  document.getElementById("title").textContent =
    signup ? "Sign Up" : "Sign In";

  document.getElementById("submit").textContent =
    signup ? "Sign Up" : "Sign In";

  document.getElementById("toggle").textContent =
    signup
      ? "Already have an account? Sign In"
      : "Create Account";

  document.getElementById("name")
    .classList.toggle("hidden", !signup);

  document.getElementById("msg").textContent = "";
}


async function auth(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const msg =
    document.getElementById("msg");

  if(!email || !password){
    msg.textContent = "Enter your email and password.";
    return;
  }

  if(signup){

    const name =
      document.getElementById("name").value.trim();

    const {error} = await sb.auth.signUp({
      email: email,
      password: password,
      options:{
        data:{
          display_name: name || "Player"
        }
      }
    });

    msg.textContent =
      error
        ? error.message
        : "Account created! Check your email if confirmation is enabled.";

  }else{

    const {error} =
      await sb.auth.signInWithPassword({
        email: email,
        password: password
      });

    msg.textContent =
      error
        ? error.message
        : "Signed in successfully!";
  }
}


/* =========================
   SESSION
   ========================= */

async function checkUser(){

  const {data:{user}} =
    await sb.auth.getUser();

  if(user){

    const logout =
      document.getElementById("logout");

    logout.classList.remove("hidden");

    logout.onclick = async () => {
      await sb.auth.signOut();
      location.reload();
    };
  }
}

checkUser();

</script>

</body>
</html>
```
