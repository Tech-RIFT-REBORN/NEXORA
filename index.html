<script>

let currentRequest =
  localStorage.getItem("nexoraCurrentRequest") || "";


/* ======================================
   LOAD SAVED REQUEST
   ====================================== */

function loadSavedRequest(){

  if(!currentRequest) return;

  document.getElementById("generatedText")
    .textContent = currentRequest;

  document.getElementById("generated")
    .style.display = "block";
}


/* ======================================
   GENERATE REQUEST
   ====================================== */

function generateRequest(){

  const name =
    document.getElementById("name")
      .value.trim();

  const title =
    document.getElementById("title")
      .value.trim();

  const description =
    document.getElementById("description")
      .value.trim();

  const budgetSelect =
    document.getElementById("budget");

  const budgetValue =
    budgetSelect.value;

  const message =
    document.getElementById("message");


  if(
    !name ||
    !title ||
    !description ||
    !budgetValue
  ){

    message.className = "error";

    message.textContent =
      "⚠️ Please fill in every field.";

    return;
  }


  const parts =
    budgetValue.split("|");

  const usd =
    parts[0];

  const inr =
    parts[1];


  currentRequest =
`📢 NEXORA REQUEST

👤 Username: ${name}

🛠️ Need: ${title}

📝 Details:
${description}

💵 Budget: $${usd} · ₹${inr}

━━━━━━━━━━━━━━━━━━
NEXORA`;


  /* SAVE REQUEST */

  localStorage.setItem(
    "nexoraCurrentRequest",
    currentRequest
  );


  /* DISPLAY REQUEST */

  document.getElementById("generatedText")
    .textContent = currentRequest;

  document.getElementById("generated")
    .style.display = "block";


  message.className = "success";

  message.textContent =
    "✅ Request generated!";


  document.getElementById("generated")
    .scrollIntoView({
      behavior:"smooth"
    });
}


/* ======================================
   COPY REQUEST
   ====================================== */

async function copyRequest(){

  const copyMessage =
    document.getElementById("copyMessage");


  if(!currentRequest){

    copyMessage.className = "error";

    copyMessage.textContent =
      "⚠️ Generate a request first.";

    return;
  }


  try{

    await navigator.clipboard.writeText(
      currentRequest
    );


    copyMessage.className = "success";

    copyMessage.textContent =
      "✅ Request copied!";


  }catch(error){

    copyMessage.className = "error";

    copyMessage.textContent =
      "❌ Couldn't copy automatically.";

  }

}


/* ======================================
   START
   ====================================== */

loadSavedRequest();

</script>
