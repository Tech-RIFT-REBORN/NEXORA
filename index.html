<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NEXORA</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#070910;
  color:#fff;
}

nav{
  height:70px;
  padding:0 7%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #202638;
  background:#080b13;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:3px;
  color:#7282ff;
}

.container{
  max-width:1050px;
  margin:auto;
  padding:60px 20px;
}

.hero{
  text-align:center;
  padding:40px 0 65px;
}

.hero h1{
  font-size:65px;
  margin-bottom:15px;
}

.hero p{
  color:#9ca5bb;
  font-size:18px;
}

.section{
  margin-bottom:40px;
}

.section-title{
  font-size:28px;
  margin-bottom:15px;
}

.card{
  background:#101522;
  border:1px solid #242c40;
  border-radius:15px;
  padding:25px;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:9px;
  border:1px solid #293249;
  background:#080c15;
  color:white;
  outline:none;
}

select{
  cursor:pointer;
}

select option{
  background:#080c15;
  color:white;
}

textarea{
  min-height:110px;
  resize:vertical;
}

button{
  padding:12px 18px;
  border:0;
  border-radius:9px;
  background:#7282ff;
  color:white;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
}

button:hover{
  opacity:.85;
}

.hint{
  color:#8f99ae;
  margin-bottom:15px;
  line-height:1.5;
}

#requests{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

.request{
  background:#101522;
  border:1px solid #242c40;
  border-radius:14px;
  padding:20px;
}

.request h3{
  margin-bottom:10px;
}

.request p{
  color:#a5aec1;
  line-height:1.5;
  margin:7px 0;
}

.budget{
  display:inline-block;
  margin-top:10px;
  padding:7px 11px;
  border-radius:8px;
  background:#17251f;
  color:#57d49e;
  font-weight:bold;
}

.time{
  display:block;
  margin-top:12px;
  color:#66718a;
  font-size:12px;
}

.empty{
  color:#818ba0;
}

footer{
  text-align:center;
  padding:35px;
  color:#626c82;
  border-top:1px solid #202638;
}
</style>
</head>

<body>

<nav>
  <div class="logo">NEXORA</div>
</nav>


<div class="container">

  <!-- HERO -->

  <section class="hero">

    <h1>NEXORA</h1>

    <p>
      Find experts. Raise requests. Get things done.
    </p>

  </section>


  <!-- HIRE AN EXPERT -->

  <section class="section">

    <h2 class="section-title">
      👨‍💻 Hire an Expert
    </h2>

    <div class="card">

      <p class="hint">
        Tell the NEXORA community what you need.
        Your request will appear publicly.
        Use a username or nickname — don't enter your real name.
      </p>

      <input
        id="name"
        maxlength="30"
        placeholder="What's your name? (Username, not real name)"
      >

      <input
        id="title"
        maxlength="80"
        placeholder="What do you need help with?"
      >

      <textarea
        id="description"
        maxlength="500"
        placeholder="Describe what you need..."
      ></textarea>

      <select id="budget">

        <option value="" disabled selected>
          Select your budget
        </option>

        <option value="1" data-inr="95">
          $1 — ₹95
        </option>

        <option value="5" data-inr="475">
          $5 — ₹475
        </option>

        <option value="10" data-inr="950">
          $10 — ₹950
        </option>

        <option value="15" data-inr="1425">
          $15 — ₹1,425
        </option>

        <option value="20" data-inr="1900">
          $20 — ₹1,900
        </option>

        <option value="25" data-inr="2375">
          $25 — ₹2,375
        </option>

        <option value="50" data-inr="4750">
          $50 — ₹4,750
        </option>

        <option value="100" data-inr="9500">
          $100 — ₹9,500
        </option>

      </select>

      <button onclick="raiseRequest()">
        📢 Raise Request
      </button>

      <p
        id="message"
        style="margin-top:12px;color:#8f99ae;"
      ></p>

    </div>

  </section>


  <!-- PUBLIC REQUESTS -->

  <section class="section">

    <h2 class="section-title">
      🌐 Public Requests
    </h2>

    <div id="requests"></div>

  </section>

</div>


<footer>
  NEXORA © 2026
</footer>


<script>

/* ======================================
   RAISE REQUEST
   ====================================== */

function raiseRequest(){

  const name =
    document.getElementById("name")
      .value.trim();

  const title =
    document.getElementById("title")
      .value.trim();

  const description =
    document.getElementById("description")
      .value.trim();

  const budgetSelect =
    document.getElementById("budget");

  const selected =
    budgetSelect.options[budgetSelect.selectedIndex];

  const budget =
    budgetSelect.value;

  const inr =
    selected ? selected.dataset.inr : "";

  const message =
    document.getElementById("message");


  if(!name || !title || !description || !budget){

    message.textContent =
      "⚠️ Please fill in every field.";

    return;
  }


  const request = {

    name:name,

    title:title,

    description:description,

    budget:budget,

    inr:inr,

    time:new Date().toLocaleString()

  };


  const requests =
    JSON.parse(
      localStorage.getItem("nexoraRequests")
      || "[]"
    );


  requests.unshift(request);


  localStorage.setItem(
    "nexoraRequests",
    JSON.stringify(requests)
  );


  document.getElementById("name").value="";
  document.getElementById("title").value="";
  document.getElementById("description").value="";
  document.getElementById("budget").selectedIndex=0;


  message.textContent =
    "✅ Your request has been posted!";


  showRequests();
}


/* ======================================
   SHOW REQUESTS
   ====================================== */

function showRequests(){

  const box =
    document.getElementById("requests");


  const requests =
    JSON.parse(
      localStorage.getItem("nexoraRequests")
      || "[]"
    );


  if(requests.length === 0){

    box.innerHTML =
      '<p class="empty">No requests yet. Be the first!</p>';

    return;
  }


  box.innerHTML =
    requests.map(request => `

      <div class="request">

        <h3>
          ${escapeHTML(request.title)}
        </h3>

        <p>
          👤 <b>${escapeHTML(request.name)}</b>
        </p>

        <p>
          ${escapeHTML(request.description)}
        </p>

        <span class="budget">
          💵 $${escapeHTML(request.budget)}
          · ₹${escapeHTML(request.inr || "0")}
        </span>

        <span class="time">
          Posted ${escapeHTML(request.time)}
        </span>

      </div>

    `).join("");
}


/* ======================================
   SECURITY
   ====================================== */

function escapeHTML(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* ======================================
   LOAD
   ====================================== */

showRequests();

</script>

</body>
</html>
