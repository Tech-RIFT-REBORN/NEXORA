```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXORA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#070910;
  color:white;
}

nav{
  height:70px;
  padding:0 7%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #202638;
  background:#080b13;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:3px;
  color:#7282ff;
}

.nav-buttons button{
  margin-left:8px;
}

button{
  padding:11px 18px;
  border:none;
  border-radius:9px;
  background:#7282ff;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.85;
}

.container{
  max-width:1050px;

  padding:60px 20px;

  text-align:center;

.hero h1{
  font-size:65px;

}

  color:#9ca5bb;
  font-size:18px;
}

  margin-bottom:35px;
}

.section-title{
  margin-bottom:15px;
  font-size:28px;
}

.card{
  background:#101522;
  border:1px solid #242c40;
  border-radius:15px;
  padding:25px;
}

  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.expert{
  background:#0d121e;
  border:1px solid #252d40;

}

.expert h3{

}

.expert p{

</style>
</head>

<body>

<nav>

  <div class="logo">
    NEXORA
  </div>

  <div class="nav-buttons">
    <button onclick="openAuth('signin')">
      Sign In
    </button>

    <button onclick="openAuth('signup')">
      Create Account
    </button>
  </div>

</nav>


<div class="container">

  <section class="hero">

    <h1>NEXORA</h1>

    <p>
      Connect with people, hire experts, and showcase your skills.
    </p>

  </section>


  <!-- PUBLIC HIRE EXPERT -->

  <section class="section">

    <h2 class="section-title">
      👨‍💻 Hire an Expert
    </h2>

    <div class="card">

      <p style="color:#9da6ba;margin-bottom:15px;">
        Looking for help? Post what you need and let people find your request.
        This section is public — no account required.
      </p>

      <input
        id="hireTitle"
        placeholder="What do you need help with?"
      >

      <textarea
        id="hireDescription"
        placeholder="Describe the job..."
      ></textarea>

      <input
        id="hireContact"
        placeholder="How can people contact you?"
      >

      <button onclick="submitHire()">
        Post Request
      </button>

      <div id="hireMessage" class="message"></div>

    </div>

  </section>


  <!-- PUBLIC POSTS -->

  <section class="section">

    <h2 class="section-title">
      🌐 Public Expert Requests
    </h2>

    <div
      id="expertList"
      class="expert-grid"
    >
      <p style="color:#8f99ae;">
        Loading...
      </p>
    </div>

  </section>

</div>


<footer>
  NEXORA © 2026
</footer>


<!-- AUTH MODAL -->

<div id="authModal" class="modal hidden">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeAuth()"
    >
      ✕
    </button>

    <h2 id="authTitle">
      Sign In
    </h2>

    <br>

    <input
      id="authName"
      class="hidden"
      placeholder="Display Name"
    >

    <input
      id="authEmail"
      type="email"
      placeholder="Email"
    >

    <input
      id="authPassword"
      type="password"
      placeholder="Password"
    >

    <button onclick="submitAuth()">
      <span id="authButton">
        Sign In
      </span>
    </button>

    <button
      style="background:#242c3d"
      onclick="switchAuth()"
    >
      <span id="switchText">
        Create Account
      </span>
    </button>

    <div
      id="authMessage"
      class="message"
    ></div>

  </div>

</div>


<script>

/* =========================================
   SUPABASE
   ========================================= */

const SUPABASE_URL =
"YOUR_SUPABASE_URL";

const SUPABASE_KEY =
"YOUR_SUPABASE_ANON_KEY";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   AUTH
   ========================================= */

let authMode = "signin";


function openAuth(mode){

  authMode = mode;

  document
    .getElementById("authModal")
    .classList.remove("hidden");

  updateAuthUI();
}


function closeAuth(){

  document
    .getElementById("authModal")
    .classList.add("hidden");
}


function switchAuth(){

  authMode =
    authMode === "signin"
      ? "signup"
      : "signin";

  updateAuthUI();
}


function updateAuthUI(){

  const signup =
    authMode === "signup";

  document.getElementById("authTitle")
    .textContent =
      signup
        ? "Create Account"
        : "Sign In";

  document.getElementById("authButton")
    .textContent =
      signup
        ? "Create Account"
        : "Sign In";

  document.getElementById("switchText")
    .textContent =
      signup
        ? "Already have an account?"
        : "Create Account";

  document.getElementById("authName")
    .classList.toggle(
      "hidden",
      !signup
    );

  document.getElementById("authMessage")
    .textContent = "";
}


async function submitAuth(){

  const email =
    document.getElementById("authEmail")
      .value.trim();

  const password =
    document.getElementById("authPassword")
      .value;

  const message =
    document.getElementById("authMessage");


  if(!email || !password){

    message.textContent =
      "Please enter your email and password.";

    return;
  }


  if(authMode === "signup"){

    const name =
      document.getElementById("authName")
        .value.trim();

    const {data,error} =
      await db.auth.signUp({

        email:email,

        password:password,

        options:{
          data:{
            display_name:
              name || "Player"
          }
        }

      });


    if(error){

      message.textContent =
        error.message;

      return;
    }


    message.textContent =
      data.session
        ? "Account created!"
        : "Account created! Check your email.";

  }


  else{

    const {error} =
      await db.auth.signInWithPassword({

        email:email,

        password:password

      });


    if(error){

      message.textContent =
        error.message;

      return;
    }


    message.textContent =
      "Signed in successfully!";

  }

}


/* =========================================
   HIRE AN EXPERT
   ========================================= */

async function submitHire(){

  const title =
    document.getElementById("hireTitle")
      .value.trim();

  const description =
    document.getElementById("hireDescription")
      .value.trim();

  const contact =
    document.getElementById("hireContact")
      .value.trim();

  const message =
    document.getElementById("hireMessage");


  if(!title || !description || !contact){

    message.textContent =
      "Please fill in all fields.";

    return;
  }


  const {error} =
    await db
      .from("expert_requests")
      .insert({

        title:title,

        description:description,

        contact:contact

      });


  if(error){

    message.textContent =
      error.message;

    return;
  }


  message.textContent =
    "Your request is now public!";


  document.getElementById("hireTitle")
    .value = "";

  document.getElementById("hireDescription")
    .value = "";

  document.getElementById("hireContact")
    .value = "";


  loadExperts();

}


/* =========================================
   LOAD PUBLIC REQUESTS
   ========================================= */

async function loadExperts(){

  const list =
    document.getElementById("expertList");


  const {data,error} =
    await db
      .from("expert_requests")
      .select("*")
      .order("created_at",{ascending:false});


  if(error){

    list.innerHTML =
      "<p style='color:#ff7185'>Could not load requests.</p>";

    return;
  }


  if(!data || data.length === 0){

    list.innerHTML =
      "<p style='color:#8f99ae'>No requests yet.</p>";

    return;
  }


  list.innerHTML =
    data.map(item => `

      <div class="expert">

        <h3>
          ${escapeHTML(item.title)}
        </h3>

        <p>
          ${escapeHTML(item.description)}
        </p>

        <small style="color:#7182ff;">
          Contact: ${escapeHTML(item.contact)}
        </small>

      </div>

    `).join("");

}


function escapeHTML(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================
   START
   ========================================= */

loadExperts();

</script>

</body>
</html>
